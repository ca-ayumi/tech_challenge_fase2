[tool.poetry]
name = "rota-medica"
version = "1.0.0"
description = "Otimizacao de rotas de distribuicao de medicamentos e insumos com Algoritmos Geneticos (VRP) e LLM"
authors = ["FIAP - IA para DEVS - Tech Challenge Fase 2"]
readme = "docs/DOCUMENTACAO.md"
packages = [{ include = "rota_medica" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.26"
pandas = "^2.2"
folium = "^0.16"
streamlit = "^1.36"
streamlit-folium = "^0.21"
plotly = "^5.22"
openai = "^1.35"
google-genai = "^1.0"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.5"

[tool.poetry.scripts]
rota-medica = "rota_medica.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
